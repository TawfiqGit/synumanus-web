<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:url" content="{{CANONICAL}}" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <title>{{TITLE}}</title>
  <link rel="icon" href="/assets/v-dark.png" type="image/png" />
  <script>
    /* Animation du hero : activée avant le premier rendu, jamais si « réduire les animations ». */
    if (window.matchMedia && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion-ok');
  </script>
  <link rel="stylesheet" href="/v2/ds.css" />
{{EXTRA_STYLES}}
{{STRUCTURED_DATA}}
</head>
<body id="top" class="v2 {{BODY_CLASS}}">
  <a class="skip-link" href="#main">Aller au contenu</a>
{{HEADER}}
{{CONTENT}}
{{FOOTER}}
{{WHATSAPP}}
  <script src="/config.js"></script>
  <script src="/script.js" defer></script>
  <script src="/v2/ds.js" defer></script>
{{EXTRA_SCRIPTS}}
</body>
</html>
